<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Cinzel:wght@400;500;600&amp;family=Montserrat:wght@300;400;500&amp;display=swap');
      .kg-monogram { fill: #4F0911; font-family: 'Cormorant Garamond', Georgia, serif; }
      .kg-title { fill: #4F0911; font-family: 'Cinzel', 'Cormorant Garamond', serif; letter-spacing: 0.18em; font-size: 42px; font-weight: 500; }
      .kg-tagline { fill: #713132; font-family: 'Cormorant Garamond', Georgia, serif; letter-spacing: 0.22em; font-size: 22px; font-style: italic; opacity: 0.95; }
    </style>
  </defs>

  <!-- Central KG Monogram -->
  <g transform="translate(300, 140)">
    <!-- Intertwined KG Monogram Symbol -->
    <path d="M -52,-115 L -36,-115 L -36,25 L -52,25 Z" fill="#4F0911" />
    <path d="M -58,-115 L -30,-115 L -30,-108 L -44,-108 L -44,18 L -30,18 L -30,25 L -58,25 L -58,18 L -44,18 L -44,-108 L -58,-108 Z" fill="#4F0911" />
    <path d="M -36,-50 L 18,-112 L 38,-112 L -20,-42 L 42,25 L 20,25 L -32,-30 L -36,-26 L -36,-38 Z" fill="#4F0911" />
    <!-- G Oval Loop Interlocking with K -->
    <path d="M 12,-78 C -22,-78 -46,-45 -46,-5 C -46,38 -18,72 24,72 C 54,72 74,52 74,22 L 74,2 L 24,2 L 24,14 L 60,14 L 60,22 C 60,42 46,58 24,58 C -8,58 -30,30 -30,-5 C -30,-40 -10,-64 12,-64 C 28,-64 42,-54 48,-40 L 62,-46 C 54,-66 36,-78 12,-78 Z" fill="#4F0911" opacity="0.95" />
    <!-- G Serif Accent Terminal -->
    <circle cx="24" cy="8" r="2.5" fill="#4F0911" />
  </g>

  <!-- Typography: KARLA GODOY -->
  <text x="300" y="280" text-anchor="middle" class="kg-title">KARLA GODOY</text>

  <!-- Flourish Divider -->
  <g transform="translate(300, 305)" opacity="0.8">
    <line x1="-120" y1="0" x2="-25" y2="0" stroke="#713132" stroke-width="0.8" />
    <circle cx="0" cy="0" r="2.5" fill="#713132" />
    <line x1="25" y1="0" x2="120" y2="0" stroke="#713132" stroke-width="0.8" />
  </g>

  <!-- Tagline: Nutrition • Wellness • Beauty -->
  <text x="300" y="340" text-anchor="middle" class="kg-tagline">Nutrition  •  Wellness  •  Beauty</text>
</svg>
