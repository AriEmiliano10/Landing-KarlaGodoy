<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="kgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5F0" />
      <stop offset="50%" stop-color="#EFE6DD" />
      <stop offset="100%" stop-color="#DFD0C3" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#856654" />
      <stop offset="100%" stop-color="#4F0911" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&amp;family=Montserrat:wght@400;500;600&amp;display=swap');
      .title { font-family: 'Cormorant Garamond', serif; font-size: 28px; fill: #4F0911; font-weight: 500; }
      .subtitle { font-family: 'Montserrat', sans-serif; font-size: 13px; fill: #713132; letter-spacing: 0.18em; text-transform: uppercase; }
      .instruction { font-family: 'Montserrat', sans-serif; font-size: 12px; fill: #856654; letter-spacing: 0.12em; }
    </style>
  </defs>

  <rect width="600" height="800" fill="url(#kgBg)" />
  <rect x="25" y="25" width="550" height="750" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Silhouette / Frame -->
  <g transform="translate(300, 320)" opacity="0.85">
    <!-- Camera / Portrait Icon Frame -->
    <circle cx="0" cy="-60" r="70" fill="none" stroke="#713132" stroke-width="2" />
    <path d="M -90,90 C -90,0 -40,-20 0,-20 C 40,-20 90,0 90,90 Z" fill="none" stroke="#713132" stroke-width="2" />
    <circle cx="0" cy="-60" r="5" fill="#4F0911" />
  </g>

  <g transform="translate(300, 500)">
    <text x="0" y="0" text-anchor="middle" class="title">Karla Godoy</text>
    <text x="0" y="30" text-anchor="middle" class="subtitle">Nutrición &amp; Wellness</text>

    <rect x="-170" y="65" width="340" height="42" rx="6" fill="#4F0911" />
    <text x="0" y="91" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" letter-spacing="0.14em">REEMPLAZAR CON FOTOGRAFÍA DE KARLA</text>

    <text x="0" y="135" text-anchor="middle" class="instruction">Guardar archivo como: karla-godoy.jpg</text>
    <text x="0" y="155" text-anchor="middle" class="instruction">en /ebook-karla-godoy/assets/images/</text>
  </g>
</svg>
